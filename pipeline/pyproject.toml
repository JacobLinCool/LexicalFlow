[project]
name = "lexicalflow-pipeline"
version = "0.1.0"
description = "Offline question-bank generation and validation for Lexical Flow"
requires-python = ">=3.11,<3.13"
dependencies = [
  "wordfreq>=3.1",
  "nltk>=3.9",
  "lemminflect>=0.2.3",
  "numpy>=1.26",
  "torch>=2.4",
  "transformers>=4.45",
  "sentence-transformers>=3.0",
  "tqdm>=4.66",
  "spacy>=3.8.18",
  "en-core-web-sm",
  "better-profanity>=0.7.0",
  "opencc-python-reimplemented>=0.1.7",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
